server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API и healthcheck — на бэкенд (имя сервиса из docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    # SPA: любые маршруты отдают index.html
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
