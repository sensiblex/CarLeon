services:
  backend:
    build: ./backend
    container_name: carleon-backend
    ports:
      - "8000:8000"
    volumes:
      - blockchain-data:/app/data
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://carleon:carleon@postgres:5432/carleon
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: carleon-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carleon
      POSTGRES_PASSWORD: carleon
      POSTGRES_DB: carleon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carleon -d carleon"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  blockchain-data:
